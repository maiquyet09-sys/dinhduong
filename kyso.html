<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff">

<title>Ký PDF · MedDental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#f3f5f9;--card:#fff;--card2:#f3f6fb;--ink:#101828;--mut:rgba(16,24,40,.58);--mut2:rgba(16,24,40,.38);--line:rgba(16,24,40,.1);--teal:#1e3a6b;--teal-bg:rgba(47,111,237,.08);--teal-ln:rgba(47,111,237,.28);--gold:#d4af5f}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{padding-left:16px;padding-right:16px}
.main{max-width:900px;margin:0 auto;padding-top:16px;padding-bottom:100px}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.trow{display:flex;align-items:center;gap:10px;padding-top:12px;padding-bottom:12px;max-width:900px;margin:0 auto}
.ttl{flex:1;min-width:0;font-weight:800;color:var(--teal);letter-spacing:-.01em}
.ttl small{font-weight:600;color:var(--mut);margin-left:6px}
.logo{width:8px;height:22px;border-radius:4px;background:var(--gold)}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(15,40,90,.06),0 6px 20px rgba(15,40,90,.05)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:14px;padding:14px;font:inherit;font-weight:700;cursor:pointer;text-align:center;transition:transform .12s ease,opacity .12s ease}
.btn:active{transform:scale(.97);opacity:.9}
.btn-primary{background:var(--teal);color:#fff;box-shadow:0 4px 16px rgba(47,111,237,.25)}
.btn-outline{background:var(--teal-bg);color:var(--teal);border:1px solid var(--teal-ln)}
.btn:disabled{background:rgba(16,24,40,.06);color:rgba(16,24,40,.28);border-color:rgba(16,24,40,.06);cursor:default;box-shadow:none;transform:none}
.inp{width:100%;border:1px solid rgba(15,40,90,.12);border-radius:14px;padding:11px 12px;font:inherit;background:#fff;color:var(--ink);outline:none}
.inp:focus{border-color:var(--teal-ln)}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:6px}
#sigovl{position:fixed;inset:0;z-index:150;background:rgba(16,24,40,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.sigcard{background:#fff;border-radius:18px;width:100%;max-width:480px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#sigcv{display:block;width:100%;height:210px;border:1.5px dashed rgba(16,24,40,.25);border-radius:12px;background:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
#toast{position:fixed;bottom:40px;left:0;right:0;z-index:300;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
#toast .in{background:#1c1917;color:#fff;font-size:14px;font-weight:500;border-radius:999px;padding:8px 16px;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;max-width:100%;text-align:center}
#toast .in.show{opacity:1}
</style>
</head>
<body>
<div class="topbar"><div class="trow wrap"><span class="logo"></span><div class="ttl">Ký PDF<small>MedDental</small></div></div></div>
<div class="main wrap"><input type="file" id="pdsFile" accept="application/pdf,.pdf" style="display:none" onchange="PDS.load(this.files&&this.files[0])"><div id="pdsTop"></div><div id="pdsPages" style="margin-top:12px"></div></div>
<div id="toast"><div class="in"></div></div>
<script>
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var _tt;function toast(m){var e=document.querySelector('#toast .in');e.textContent=m;e.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){e.classList.remove('show');},2600);}
function ic(n){var p={file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',download:'<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>'}[n]||'';return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function deviceLabel(){var u=navigator.userAgent||'';var os=/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac OS X/.test(u)?'Mac':'thiết bị khác';var br=/Edg\//.test(u)?'Edge':/Chrome\//.test(u)?'Chrome':/Safari\//.test(u)?'Safari':/Firefox\//.test(u)?'Firefox':'';return os+(br?', '+br:'');}
function nowLabel(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};return p(d.getHours())+':'+p(d.getMinutes())+' ngày '+p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();}
function kkTry(urls,chk){return new Promise(function(res){var i=0;(function next(){if(chk())return res(true);if(i>=urls.length)return res(false);var el=document.createElement('script');el.src=urls[i++];el.onload=function(){chk()?res(true):next();};el.onerror=function(){el.remove();next();};document.head.appendChild(el);})();});}
/* ----- Xác thực thiết bị (Face ID / vân tay / mã máy) qua WebAuthn ----- */
function waOk(){return !!(window.PublicKeyCredential&&navigator.credentials&&navigator.credentials.create&&window.isSecureContext);}
function waRand(n){return crypto.getRandomValues(new Uint8Array(n));}
function waB64(b){var a=new Uint8Array(b),s='',i;for(i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function waUn(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var r=atob(s),a=new Uint8Array(r.length),i;for(i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function waSign(ten){
  var cr=lsGet('kyso_wa',null);
  if(!cr){var nm=ten||'Người ký';
    return navigator.credentials.create({publicKey:{challenge:waRand(32),rp:{name:'Ký PDF MedDental',id:location.hostname},user:{id:waRand(16),name:nm,displayName:nm},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000,attestation:'none'}})
      .then(function(c){lsSet('kyso_wa',{id:waB64(c.rawId),at:Date.now()});});}
  return navigator.credentials.get({publicKey:{challenge:waRand(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id:waUn(cr.id),transports:['internal']}],userVerification:'required',timeout:60000}});
}
/* ----- Khung vẽ chữ ký ----- */
var SIGP=null;
function padOpen(key,title,defName,cb){
  SIGP={key:key,cb:cb,ink:false,drawing:false,minx:1e9,miny:1e9,maxx:-1e9,maxy:-1e9};
  var o=document.createElement('div');o.id='sigovl';
  o.innerHTML='<div class="sigcard"><div style="font-weight:800;font-size:16px;margin-bottom:10px">Ký xác nhận: '+esc(title)+'</div>'
    +'<label class="lbl">Họ tên người ký</label><input class="inp" id="signame" value="'+esc(defName||'')+'" style="margin-bottom:10px">'
    +'<canvas id="sigcv"></canvas>'
    +'<div style="font-size:12px;color:var(--mut);margin:6px 0 12px">Dùng ngón tay vẽ chữ ký vào khung. Chữ ký được lưu kèm họ tên, thời gian và thiết bị.</div>'
    +(waOk()?'<label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:12px"><input type="checkbox" id="sigwa" '+(lsGet('kyso_wapref',true)!==false?'checked ':'')+'style="margin-top:3px"><span><b>Xác thực bằng Face ID / vân tay</b><br><span style="color:var(--mut);font-size:12px">Chỉ ai mở khoá được thiết bị này mới ký được. Lần đầu app tạo khoá xác thực trên máy.</span></span></label>':'')
    +'<div style="display:flex;gap:8px"><button class="btn btn-outline" style="flex:1;padding:12px" onclick="padClear()">Vẽ lại</button><button class="btn btn-outline" style="flex:1;padding:12px" onclick="padClose()">Huỷ</button><button class="btn btn-primary" style="flex:1.3;padding:12px" onclick="padConfirm()">Xác nhận</button></div></div>';
  document.body.appendChild(o);document.body.style.overflow='hidden';
  var cv=$('sigcv'),dpr=window.devicePixelRatio||1,r=cv.getBoundingClientRect();
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1d4ed8';
  SIGP.cv=cv;SIGP.ctx=ctx;SIGP.dpr=dpr;
  function pos(e){var b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};}
  function box(p){SIGP.minx=Math.min(SIGP.minx,p.x);SIGP.miny=Math.min(SIGP.miny,p.y);SIGP.maxx=Math.max(SIGP.maxx,p.x);SIGP.maxy=Math.max(SIGP.maxy,p.y);}
  cv.addEventListener('pointerdown',function(e){e.preventDefault();if(cv.setPointerCapture)cv.setPointerCapture(e.pointerId);var p=pos(e);SIGP.drawing=true;SIGP.last=p;box(p);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+0.01,p.y+0.01);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);});
  cv.addEventListener('pointermove',function(e){if(!SIGP||!SIGP.drawing)return;e.preventDefault();var p=pos(e),m={x:(SIGP.last.x+p.x)/2,y:(SIGP.last.y+p.y)/2};ctx.quadraticCurveTo(SIGP.last.x,SIGP.last.y,m.x,m.y);ctx.stroke();ctx.beginPath();ctx.moveTo(m.x,m.y);SIGP.last=p;box(p);SIGP.ink=true;});
  var stop=function(){if(SIGP)SIGP.drawing=false;};cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);cv.addEventListener('pointerleave',stop);
}
function padClear(){if(!SIGP)return;SIGP.ctx.clearRect(0,0,SIGP.cv.width,SIGP.cv.height);SIGP.ink=false;SIGP.minx=1e9;SIGP.miny=1e9;SIGP.maxx=-1e9;SIGP.maxy=-1e9;}
function padClose(){var o=$('sigovl');if(o)o.remove();document.body.style.overflow='';SIGP=null;}
function padExport(){
  var d=SIGP.dpr,pad=10,cv=SIGP.cv,x=Math.max(0,SIGP.minx-pad),y=Math.max(0,SIGP.miny-pad);
  var w=Math.min(cv.width/d-x,SIGP.maxx-SIGP.minx+pad*2),h=Math.min(cv.height/d-y,SIGP.maxy-SIGP.miny+pad*2);
  var ow=Math.min(Math.round(w*d),600),oh=Math.max(1,Math.round(h*d*(ow/(w*d)))),oc=document.createElement('canvas');oc.width=ow;oc.height=oh;
  oc.getContext('2d').drawImage(cv,x*d,y*d,w*d,h*d,0,0,ow,oh);return {url:oc.toDataURL('image/png'),w:ow,h:oh};
}
function padConfirm(){
  if(!SIGP)return;
  var ten=($('signame').value||'').trim();
  if(!SIGP.ink){toast('Chưa có chữ ký, hãy vẽ vào khung');return;}
  if(!ten){toast('Nhập họ tên người ký');return;}
  var chk=$('sigwa'),useWa=!!(chk&&chk.checked);if(chk)lsSet('kyso_wapref',useWa);
  var fin=function(auth){
    if(!SIGP)return;var ex=padExport(),cb=SIGP.cb,sig={img:ex.url,w:ex.w,h:ex.h,ten:ten,time:nowLabel(),dev:deviceLabel()};
    if(auth)sig.auth=auth;padClose();cb(sig);toast(auth?'Đã ký và xác thực':'Đã ký xác nhận');
  };
  if(!useWa){fin('');return;}
  waSign(ten).then(function(){lsSet('kyso_wafail',0);fin('Xác thực thiết bị (Face ID/vân tay/mã máy)');}).catch(function(e){
    var f=(lsGet('kyso_wafail',0)||0)+1;lsSet('kyso_wafail',f);if(f>=2){lsSet('kyso_wa',null);lsSet('kyso_wafail',0);}
    toast('Chưa xác thực được'+(e&&e.name==='NotAllowedError'?' (đã huỷ hoặc không khớp)':'')+' — thử lại, hoặc bỏ chọn xác thực để ký thường');
  });
}
</script>
<script>
/* ===== Ký PDF: tải file PDF lên, nhiều người ký trên cùng 1 file =====
   Trang độc lập. Thư viện nạp khi cần: lib/ (cùng thư mục) trước, CDN dự phòng. Dữ liệu chỉ nằm trong bộ nhớ. */
(function(){
var PDS={name:'',buf:null,doc:null,hash:'',pw:{},signers:[{key:'sg1',role:'Giám đốc'},{key:'sg2',role:'Thủ kho'},{key:'sg3',role:'Hành chính'}],
  sig:{},place:{},st:{},armed:'',last:'',n:3,tok:0,aud:true,out:null,busy:false,drag:null};
window.PDS=PDS;
var LIBS={
  pl:['lib/pdf-lib.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js','https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js'],
  pj:['lib/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js']};
function $(i){return document.getElementById(i);}
function lg(m,e){try{console.warn(m,e);}catch(x){}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function loadLibs(){
  return kkTry(LIBS.pl,function(){return !!window.PDFLib;}).then(function(a){
    return a?kkTry(LIBS.pj,function(){return !!window.pdfjsLib;}):false;
  }).then(function(ok){
    if(!ok)return false;
    if(!pdfjsLib.GlobalWorkerOptions.workerSrc){
      var el=[].slice.call(document.scripts).filter(function(s){return /pdf(\.min)?\.js(\?|$)/.test(s.src);}).pop();
      pdfjsLib.GlobalWorkerOptions.workerSrc=el?el.src.replace(/pdf(\.min)?\.js/,'pdf.worker.min.js'):LIBS.pj[1].replace('pdf.min.js','pdf.worker.min.js');
    }
    return true;
  });
}
function sha(buf){
  try{return crypto.subtle.digest('SHA-256',buf).then(function(h){return [].map.call(new Uint8Array(h),function(b){return ('0'+b.toString(16)).slice(-2);}).join('');});}
  catch(e){return Promise.resolve('');}
}
function bytesOf(u){var b=atob(u.split(',')[1]),a=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function sgOf(k){return PDS.signers.filter(function(s){return s.key===k;})[0];}
function hOf(k){var st=PDS.st[k],pl=PDS.place[k],d=PDS.pw[pl.p];return pl.w*(st.h/st.w)*(d.w/d.h);}

/* ---------- Ảnh con dấu chữ ký: vai trò + chữ ký tay + họ tên + thời gian (vẽ bằng canvas để có tiếng Việt) ---------- */
function fitFont(x,t,px,max){while(px>11){x.font='700 '+px+'px Arial, sans-serif';if(x.measureText(t).width<=max)break;px-=2;}return px;}
function mk(s,g){
  return new Promise(function(res){
    var im=new Image();
    im.onload=function(){
      var W=440,pad=14,mw=W-2*pad,sc=Math.min(300/im.width,110/im.height,2),iw=Math.round(im.width*sc),ih=Math.round(im.height*sc);
      var H=14+34+10+ih+8+32+6+24+(g.auth?26:0)+14;
      var c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
      x.textAlign='center';x.textBaseline='alphabetic';var y=14;
      x.fillStyle='#1e3a6b';fitFont(x,s.role,28,mw);y+=28;x.fillText(s.role,W/2,y);y+=10;
      x.drawImage(im,(W-iw)/2,y,iw,ih);y+=ih+8+26;
      x.fillStyle='#111';fitFont(x,g.ten,26,mw);x.fillText(g.ten,W/2,y);y+=26;
      x.fillStyle='#555';x.font='400 20px Arial, sans-serif';x.fillText(g.time,W/2,y);
      if(g.auth){y+=24;x.fillStyle='#047857';x.font='400 18px Arial, sans-serif';x.fillText('Đã xác thực bằng thiết bị',W/2,y);}
      PDS.st[s.key]={url:c.toDataURL('image/png'),w:W,h:H,t:g.time+'|'+g.ten+'|'+s.role};
      res();
    };
    im.onerror=function(){res();};
    im.src=g.img;
  });
}
function prep(){
  var ps=[];
  PDS.signers.forEach(function(s){
    var g=PDS.sig[s.key];if(!g)return;
    var c=PDS.st[s.key];if(c&&c.t===g.time+'|'+g.ten+'|'+s.role)return;
    ps.push(mk(s,g));
  });
  return Promise.all(ps);
}

/* ---------- Màn hình ---------- */
function rPdfSign(){
  var host=$('pdsPages');
  host.addEventListener('click',onClick);host.addEventListener('pointerdown',onDown);host.addEventListener('pointermove',onMove);
  host.addEventListener('pointerup',onUp);host.addEventListener('pointercancel',onUp);
  rTop();
}
function rTop(){
  var t=$('pdsTop');if(!t)return;
  var h='';
  if(!PDS.doc){
    h+='<div class="card"><div style="font-weight:700;margin-bottom:6px">Ký nhiều người trên cùng một file PDF</div>'
      +'<div style="font-size:13px;color:var(--mut);margin-bottom:12px">Chọn file PDF → từng người vẽ chữ ký (có thể xác thực Face ID/vân tay) → chạm vào trang để đặt chữ ký → xuất file đã ký kèm trang biên bản ký.</div>'
      +'<button class="btn btn-primary" onclick="PDS.pick()">'+ic('file')+'Chọn file PDF</button></div>';
    t.innerHTML=h;return;
  }
  h+='<div class="card" style="margin-bottom:10px"><div style="font-weight:700;word-break:break-all">'+esc(PDS.name)+'</div>'
    +'<div style="font-size:12px;color:var(--mut);margin:4px 0 10px">'+PDS.doc.numPages+' trang'+(PDS.hash?' · SHA-256: '+PDS.hash.slice(0,12)+'…':'')+'</div>'
    +'<button class="btn btn-outline" style="padding:10px" onclick="PDS.pick()">Đổi file PDF (xoá chữ ký đã ký)</button></div>';
  if(PDS.armed){
    var sg=sgOf(PDS.armed);
    h+='<div style="position:sticky;top:8px;z-index:6;background:#1d4ed8;color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.2)">'
      +'<span style="flex:1;font-size:14px;font-weight:600">Chạm vào trang PDF để đặt chữ ký: '+esc(sg?sg.role:'')+'</span>'
      +'<button class="btn" style="padding:6px 12px;background:#fff;color:#1d4ed8" onclick="PDS.unarm()">Huỷ</button></div>';
  }
  PDS.signers.forEach(function(s){
    var g=PDS.sig[s.key],pl=PDS.place[s.key];
    h+='<div class="card" style="margin-bottom:8px"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;font-weight:700">'+esc(s.role)+'</div>'
      +'<span style="font-size:12px;font-weight:700;color:'+(g&&pl?'#047857':g?'#b45309':'var(--mut)')+'">'+(g&&pl?'Đã ký · trang '+pl.p:g?'Chưa đặt vị trí':'Chưa ký')+'</span></div>';
    if(g){
      h+='<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><img src="'+g.img+'" style="height:38px;max-width:120px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff">'
        +'<div style="font-size:12px;color:var(--mut)">'+esc(g.ten)+'<br>'+esc(g.time)+'</div></div>'
        +'<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-primary" style="padding:8px 12px;flex:1" onclick="PDS.arm(\''+s.key+'\')">'+(pl?'Đặt lại vị trí':'Đặt vị trí')+'</button>'
        +(pl?'<button class="btn btn-outline" style="padding:8px 14px" onclick="PDS.size(\''+s.key+'\',-0.03)">−</button><button class="btn btn-outline" style="padding:8px 14px" onclick="PDS.size(\''+s.key+'\',0.03)">+</button>':'')
        +'<button class="btn btn-outline" style="padding:8px 12px" onclick="PDS.sign(\''+s.key+'\')">Ký lại</button>'
        +'<button class="btn btn-outline" style="padding:8px 12px" onclick="PDS.clr(\''+s.key+'\')">Xoá chữ ký</button></div>';
    }else{
      h+='<div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-primary" style="padding:10px;flex:1" onclick="PDS.sign(\''+s.key+'\')">'+ic('edit')+'Ký</button>'
        +'<button class="btn btn-outline" style="padding:10px 14px" onclick="PDS.del(\''+s.key+'\')">Bỏ</button></div>';
    }
    h+='</div>';
  });
  h+='<div class="card" style="margin-bottom:10px"><div style="display:flex;gap:8px"><input class="inp" id="pdsRole" list="pdsRoles" placeholder="Thêm người ký (vai trò, VD: Kế toán)" style="flex:1;min-width:0">'
    +'<datalist id="pdsRoles"><option value="Giám đốc"><option value="Thủ kho"><option value="Hành chính"><option value="Kế toán"><option value="Kế toán trưởng"><option value="Người lập"></datalist>'
    +'<button class="btn btn-outline" style="padding:10px 14px" onclick="PDS.add()">+ Thêm</button></div>'
    +'<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px"><input type="checkbox" '+(PDS.aud?'checked ':'')+'onchange="PDS.aud=this.checked"> Thêm trang “Biên bản ký xác nhận” (kèm mã băm SHA-256 file gốc)</label></div>'
    +'<button class="btn btn-primary" onclick="PDS.exp()"'+(PDS.busy?' disabled':'')+'>'+ic('download')+(PDS.busy?'Đang xuất…':'Xuất PDF đã ký')+'</button>';
  if(PDS.out){
    h+='<div class="card" style="margin-top:10px;border:1px solid #047857"><div style="font-weight:700;margin-bottom:8px">Đã tạo: '+esc(PDS.out.name)+'</div><div style="display:flex;gap:8px">'
      +'<button class="btn btn-primary" style="flex:1;padding:10px" onclick="PDS.save()">Tải về</button>'
      +(PDS.out.canShare?'<button class="btn btn-outline" style="flex:1;padding:10px" onclick="PDS.share()">Chia sẻ</button>':'')+'</div></div>';
  }
  h+='<div style="font-size:12px;color:var(--mut);margin-top:10px">Đây là chữ ký tay điện tử kèm họ tên, thời gian và xác thực thiết bị — không phải chữ ký số có chứng thư (USB token/CA). Dữ liệu chỉ nằm trên máy này; thoát app sẽ mất, hãy xuất file trước. Người ký sau có thể tải file đã xuất lên để ký tiếp.</div>';
  t.innerHTML=h;
}

/* ---------- Dựng trang PDF (pdf.js), chỉ vẽ trang đang gần màn hình ---------- */
function drawPages(){
  var host=$('pdsPages');if(!host||!PDS.doc)return;
  var tok=++PDS.tok,n=PDS.doc.numPages,i,chain=Promise.resolve();
  host.innerHTML='<div style="text-align:center;padding:20px 0;color:var(--mut);font-size:13px">Đang dựng trang PDF…</div>';
  for(i=1;i<=n;i++)(function(i){chain=chain.then(function(){return PDS.doc.getPage(i).then(function(pg){var v=pg.getViewport({scale:1});PDS.pw[i]={w:v.width,h:v.height};});});})(i);
  chain.then(function(){
    if(tok!==PDS.tok||!$('pdsPages'))return;
    var h='';
    for(i=1;i<=n;i++){var d=PDS.pw[i];
      h+='<div class="pdsPg" data-p="'+i+'" style="position:relative;width:100%;padding-bottom:'+(d.h/d.w*100)+'%;margin-bottom:12px;background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.18)">'
        +'<canvas style="position:absolute;left:0;top:0;width:100%;height:100%"></canvas><div class="pdsOv" style="position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden"></div>'
        +'<span style="position:absolute;top:4px;right:8px;font-size:11px;color:#888;pointer-events:none">Trang '+i+'/'+n+'</span></div>';}
    host.innerHTML=h;
    drawStamps();
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!e.target._r){e.target._r=1;io.unobserve(e.target);renderPg(+e.target.getAttribute('data-p'),e.target,tok);}});},{rootMargin:'800px 0px'});
    [].forEach.call(host.querySelectorAll('.pdsPg'),function(e){io.observe(e);});
  }).catch(function(e){lg('pdsPages',e);toast('Không dựng được trang PDF');});
}
function renderPg(i,el,tok){
  PDS.doc.getPage(i).then(function(pg){
    if(tok!==PDS.tok)return;
    var cv=el.querySelector('canvas'),dpr=Math.min(2,window.devicePixelRatio||1),w=el.clientWidth||340,v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:w/v0.width*dpr});
    cv.width=Math.round(v.width);cv.height=Math.round(v.height);
    return pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise;
  }).catch(function(e){lg('pdsRenderPg',e);});
}
function drawStamps(){
  var host=$('pdsPages');if(!host)return;
  host.style.cursor=PDS.armed?'crosshair':'';
  [].forEach.call(host.querySelectorAll('.pdsOv'),function(o){o.innerHTML='';});
  PDS.signers.forEach(function(s){
    var pl=PDS.place[s.key],st=PDS.st[s.key];if(!pl||!st)return;
    var ov=host.querySelector('.pdsPg[data-p="'+pl.p+'"] .pdsOv');if(!ov)return;
    var im=document.createElement('img');im.src=st.url;im.className='pdsSt';im.draggable=false;im.setAttribute('data-k',s.key);
    im.style.cssText='position:absolute;left:'+pl.x*100+'%;top:'+pl.y*100+'%;width:'+pl.w*100+'%;touch-action:none;cursor:move;outline:1.5px dashed #1d4ed8;background:rgba(255,255,255,.4)';
    ov.appendChild(im);
  });
}
function onClick(e){
  if(!PDS.armed)return;
  var ov=e.target.closest&&e.target.closest('.pdsOv');if(!ov||(e.target.classList&&e.target.classList.contains('pdsSt')))return;
  var p=+ov.parentNode.getAttribute('data-p'),r=ov.getBoundingClientRect(),k=PDS.armed,st=PDS.st[k];if(!st)return;
  var old=PDS.place[k],w=old?old.w:0.32,d=PDS.pw[p],hf=w*(st.h/st.w)*(d.w/d.h);
  PDS.place[k]={p:p,x:clamp((e.clientX-r.left)/r.width-w/2,0,1-w),y:clamp((e.clientY-r.top)/r.height-hf/2,0,Math.max(0,1-hf)),w:w};
  PDS.armed='';PDS.out=null;drawStamps();rTop();toast('Đã đặt chữ ký — kéo để chỉnh vị trí');
}
function onDown(e){
  var t=e.target;if(!t.classList||!t.classList.contains('pdsSt'))return;
  e.preventDefault();var k=t.getAttribute('data-k'),pl=PDS.place[k];
  PDS.drag={k:k,t:t,sx:e.clientX,sy:e.clientY,x0:pl.x,y0:pl.y,r:t.parentNode.getBoundingClientRect()};
  try{t.setPointerCapture(e.pointerId);}catch(x){}
}
function onMove(e){
  var d=PDS.drag;if(!d)return;e.preventDefault();
  var pl=PDS.place[d.k];pl.x=clamp(d.x0+(e.clientX-d.sx)/d.r.width,0,1-pl.w);pl.y=clamp(d.y0+(e.clientY-d.sy)/d.r.height,0,Math.max(0,1-hOf(d.k)));
  d.t.style.left=pl.x*100+'%';d.t.style.top=pl.y*100+'%';
}
function onUp(){if(PDS.drag){PDS.drag=null;PDS.out=null;}}

/* ---------- Thao tác ---------- */
PDS.pick=function(){var i=$('pdsFile');if(i){i.value='';i.click();}};
PDS.load=function(f){
  if(!f)return;
  if(f.size>40*1024*1024){toast('File quá lớn (tối đa 40 MB)');return;}
  toast('Đang đọc PDF…');
  f.arrayBuffer().then(function(buf){
    return loadLibs().then(function(ok){
      if(!ok)throw new Error('lib');
      return pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise.then(function(doc){
        return sha(buf.slice(0)).then(function(hs){
          PDS.buf=buf;PDS.doc=doc;PDS.name=f.name;PDS.hash=hs;PDS.pw={};PDS.sig={};PDS.place={};PDS.st={};PDS.armed='';PDS.out=null;
          rTop();drawPages();
        });
      });
    });
  }).catch(function(e){
    lg('pdsLoad',e);
    toast(e&&e.name==='PasswordException'?'PDF có mật khẩu, chưa hỗ trợ — hãy mở khoá file trước':e&&e.message==='lib'?'Không nạp được thư viện PDF (kiểm tra mạng hoặc thư mục lib/)':'Không đọc được file PDF');
  });
};
PDS.sign=function(k){
  var s=sgOf(k);if(!s)return;PDS.last=k;
  var nm=lsGet('kyso_names',{});
  padOpen(k,s.role,(PDS.sig[k]&&PDS.sig[k].ten)||nm[s.role]||'',function(sig){
    PDS.sig[k]=sig;var m=lsGet('kyso_names',{});m[s.role]=sig.ten;lsSet('kyso_names',m);PDS.after();
  });
};
PDS.after=function(){
  prep().then(function(){
    var k=PDS.last;PDS.out=null;
    if(k&&PDS.sig[k]&&!PDS.place[k]){PDS.armed=k;toast('Đã ký — chạm vào trang PDF để đặt chữ ký');}
    rTop();drawStamps();
  });
};
PDS.arm=function(k){PDS.armed=k;rTop();drawStamps();toast('Chạm vào trang PDF để đặt chữ ký');};
PDS.unarm=function(){PDS.armed='';rTop();drawStamps();};
PDS.size=function(k,d){var pl=PDS.place[k];if(!pl)return;pl.w=clamp(pl.w+d,0.12,0.5);pl.x=clamp(pl.x,0,1-pl.w);pl.y=clamp(pl.y,0,Math.max(0,1-hOf(k)));PDS.out=null;drawStamps();};
PDS.clr=function(k){delete PDS.sig[k];delete PDS.place[k];delete PDS.st[k];if(PDS.armed===k)PDS.armed='';PDS.out=null;rTop();drawStamps();};
PDS.del=function(k){PDS.clr(k);PDS.signers=PDS.signers.filter(function(s){return s.key!==k;});rTop();};
PDS.add=function(){
  var i=$('pdsRole'),v=((i&&i.value)||'').trim();
  if(!v){toast('Nhập vai trò người ký');return;}
  PDS.signers.push({key:'sg'+(++PDS.n),role:v.slice(0,40)});rTop();
};

/* ---------- Biên bản ký (trang cuối) ---------- */
function ell(x,t,max){t=String(t||'');if(x.measureText(t).width<=max)return t;while(t.length>1&&x.measureText(t+'…').width>max)t=t.slice(0,-1);return t+'…';}
function auditPng(){
  var W=1190,H=1684,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d'),y=130;
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.fillStyle='#1e3a6b';x.textAlign='center';x.font='700 44px Arial, sans-serif';x.fillText('BIÊN BẢN KÝ XÁC NHẬN',W/2,y);
  x.textAlign='left';y=210;
  function ln(t,f,col){x.font=f||'400 27px Arial, sans-serif';x.fillStyle=col||'#111';x.fillText(ell(x,t,1030),80,y);y+=42;}
  ln('Tài liệu: '+PDS.name);ln('Số trang gốc: '+PDS.doc.numPages);ln('Xuất lúc: '+nowLabel());
  ln('Mã băm SHA-256 của file gốc (trước khi ký):','700 24px Arial, sans-serif');
  if(PDS.hash){ln(PDS.hash.slice(0,32),'400 26px "Courier New", monospace','#1e3a6b');ln(PDS.hash.slice(32),'400 26px "Courier New", monospace','#1e3a6b');}
  else ln('(trình duyệt không hỗ trợ tính mã băm)','400 24px Arial, sans-serif','#777');
  y+=24;
  var cols=[[80,60,'STT'],[140,240,'Vai trò'],[380,250,'Người ký'],[630,270,'Thời gian ký'],[900,110,'Xác thực'],[1010,100,'Vị trí']];
  x.fillStyle='#eef1f8';x.fillRect(80,y,1030,56);x.fillStyle='#111';x.font='700 22px Arial, sans-serif';
  cols.forEach(function(k){x.fillText(k[2],k[0]+8,y+37);});y+=56;
  PDS.signers.forEach(function(s,i){
    var g=PDS.sig[s.key],pl=PDS.place[s.key];
    var v=[String(i+1),s.role,g?g.ten:'—',g?g.time:'Chưa ký',g?(g.auth?'Có':'Không'):'—',g?(pl?'Trang '+pl.p:'Chưa đặt'):'—'];
    x.font='400 22px Arial, sans-serif';x.fillStyle=g?'#111':'#b91c1c';
    cols.forEach(function(k,j){x.fillText(ell(x,v[j],k[1]-14),k[0]+8,y+40);});
    x.strokeStyle='#d5d9e2';x.lineWidth=1;x.beginPath();x.moveTo(80,y+62);x.lineTo(1110,y+62);x.stroke();y+=64;
  });
  x.fillStyle='#666';x.font='400 21px Arial, sans-serif';
  x.fillText('Chữ ký tay điện tử kèm họ tên, thời gian và xác thực thiết bị.',80,H-130);
  x.fillText('Không phải chữ ký số có chứng thư (USB token/CA). So khớp mã băm để kiểm tra file gốc.',80,H-96);
  return bytesOf(c.toDataURL('image/png'));
}

/* ---------- Xuất PDF ---------- */
PDS.exp=function(){
  if(PDS.busy)return;
  var placed=PDS.signers.filter(function(s){return PDS.sig[s.key]&&PDS.place[s.key]&&PDS.st[s.key];});
  if(!placed.length){toast('Chưa có chữ ký nào được đặt vào PDF');return;}
  var miss=PDS.signers.filter(function(s){return !PDS.sig[s.key];}).map(function(s){return s.role;});
  if(miss.length&&!confirm('Chưa ký: '+miss.join(', ')+'.\nVẫn xuất file (có thể ký tiếp ở lần sau)?'))return;
  PDS.busy=true;rTop();
  loadLibs().then(function(ok){
    if(!ok)throw new Error('lib');
    return PDFLib.PDFDocument.load(PDS.buf.slice(0),{ignoreEncryption:true});
  }).then(function(doc){
    var pages=doc.getPages(),chain=Promise.resolve();
    placed.forEach(function(s){chain=chain.then(function(){
      var pl=PDS.place[s.key],pg=pages[pl.p-1],st=PDS.st[s.key];
      if(!pg)throw new Error('page');
      if(pg.getRotation().angle%360!==0)throw new Error('rot'+pl.p);
      return doc.embedPng(bytesOf(st.url)).then(function(img){
        var cb=pg.getCropBox(),w=pl.w*cb.width,h=w*st.h/st.w;
        pg.drawImage(img,{x:cb.x+pl.x*cb.width,y:cb.y+cb.height-pl.y*cb.height-h,width:w,height:h});
      });
    });});
    return chain.then(function(){
      if(!PDS.aud)return doc;
      return doc.embedPng(auditPng()).then(function(img){var pg=doc.addPage([595.28,841.89]);pg.drawImage(img,{x:0,y:0,width:595.28,height:841.89});return doc;});
    });
  }).then(function(doc){return doc.save();}).then(function(bytes){
    var name=PDS.name.replace(/\.pdf$/i,'')+'_da-ky.pdf',canShare=false;
    try{var f=new File([bytes],name,{type:'application/pdf'});canShare=!!(navigator.canShare&&navigator.canShare({files:[f]})&&/iPhone|iPad|Android/i.test(navigator.userAgent));}catch(x){}
    PDS.out={bytes:bytes,name:name,canShare:canShare};PDS.busy=false;rTop();toast('Đã xuất PDF đã ký');
  }).catch(function(e){
    lg('pdsExport',e);PDS.busy=false;rTop();
    var m=e&&e.message||'';
    toast(m==='lib'?'Không nạp được thư viện PDF':/^rot/.test(m)?'Trang '+m.slice(3)+' bị xoay trong PDF, chưa hỗ trợ ký trên trang này':'Không xuất được PDF');
  });
};
PDS.save=function(){
  var o=PDS.out;if(!o)return;
  var u=URL.createObjectURL(new Blob([o.bytes],{type:'application/pdf'})),a=document.createElement('a');
  a.href=u;a.download=o.name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u);},4000);
};
PDS.share=function(){
  var o=PDS.out;if(!o)return;
  try{navigator.share({files:[new File([o.bytes],o.name,{type:'application/pdf'})],title:o.name}).catch(function(){});}catch(e){PDS.save();}
};
window.kysoInit=rPdfSign;
})();

kysoInit();
</script>
